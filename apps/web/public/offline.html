<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c1718">
  <meta name="robots" content="noindex, nofollow">
  <meta name="qrguitar-offline" content="v1">
  <title>Connect to QRguitar</title>
  <style>
    *{box-sizing:border-box}html{color-scheme:dark}body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:32px 22px;background:#0c1718;color:#f6edda;font:17px/1.65 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:min(100%,460px)}.brand{font-size:22px;letter-spacing:-.8px;font-weight:750;margin-bottom:64px}.brand span{color:#ed8b4a}.mark{width:60px;height:60px;display:block;margin-bottom:24px;color:#ed8b4a}h1{font-size:clamp(32px,8vw,46px);line-height:1.12;letter-spacing:-1.4px;margin:0 0 22px}p{color:#bec6bf;margin:0 0 18px}.note{font-size:14px;line-height:1.6}.actions{display:flex;flex-wrap:wrap;gap:12px;margin:32px 0}a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 22px;border:1px solid #53615b;border-radius:10px;color:#f6edda;text-decoration:none;font-weight:650}a:first-child{background:#ed8b4a;color:#0c1718;border-color:#ed8b4a}a:focus-visible{outline:3px solid #f6edda;outline-offset:5px}@media(prefers-reduced-motion:no-preference){a{transition:filter .15s}a:hover{filter:brightness(1.1)}}
  </style>
</head>
<body>
  <main>
    <div class="brand">QR<span>guitar</span></div>
    <svg class="mark" viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M8 16a25 25 0 0 1 32 0M14 23a16 16 0 0 1 20 0M20 30a6 6 0 0 1 8 0M24 37h.01M6 6l36 36"/></svg>
    <h1>Let’s get you connected.</h1>
    <p>QRguitar can’t connect right now. An internet connection is needed to open Profiles, manage your collection, and confirm updates.</p>
    <div class="actions"><a href="">Try again</a><a href="/dashboard">Your collection</a></div>
    <p class="note">If you were making a change, check its status when you reconnect before trying it again.</p>
  </main>
</body>
</html>
