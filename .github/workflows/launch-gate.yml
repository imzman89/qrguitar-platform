name: Launch gate
on:
  push:
    branches: [master]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @qrguitar/web
      - run: npm run typecheck --workspace @qrguitar/web
      - run: npm run test:launch --workspace @qrguitar/web
